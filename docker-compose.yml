name: mahyaar-maps

services:
  db:
    image: docker.arvancloud.ir/postgis/postgis:16-3.5
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "15432:5432"
    mem_limit: 1g
    cpus: "1"
    networks:
      - mapnet

  redpanda-0:
    container_name: redpanda-0
    image: docker.arvancloud.ir/redpandadata/redpanda:v26.2.2
    command:
      - redpanda
      - start
      - --smp 1
      - --memory 1G
      - --reserve-memory 0M
      - --kafka-addr internal://0.0.0.0:29092,external://0.0.0.0:9092
      - --advertise-kafka-addr internal://redpanda-0:29092,external://localhost:9092
    ports:
      - "9092:9092"
    mem_limit: 2g
    cpus: "1"
    networks:
      - mapnet

  redpanda-console:
    container_name: redpanda-console
    image: docker.arvancloud.ir/redpandadata/console:v3.11.0
    entrypoint: /bin/sh
    command: -c 'echo "$$CONSOLE_CONFIG_FILE" > /tmp/config.yml; /app/console'
    environment:
      CONFIG_FILEPATH: /tmp/config.yml
      CONSOLE_CONFIG_FILE: |
        kafka:
          brokers: ["redpanda-0:29092"]
        redpanda:
          adminApi:
            enabled: true
            urls: ["http://redpanda-0:9644"]
    ports:
      - "9300:8080"
    depends_on:
      - redpanda-0
    mem_limit: 1g
    cpus: "1"
    networks:
      - mapnet

  # One-time/on-demand importer. It does not remain running.
  importer:
    image: docker.arvancloud.ir/iboates/osm2pgsql:2.3.1
    profiles:
      - import
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
    entrypoint: ["/bin/sh", "/scripts/import.sh"]
    volumes:
      - ./data:/data:ro
      - ./config:/config:ro
      - ./scripts:/scripts:ro
    networks:
      - mapnet

  # Applies post-import SQL (columns + indexes). Uses the PostGIS image
  # because the osm2pgsql image has no psql client.
  post_import:
    image: docker.arvancloud.ir/postgis/postgis:16-3.5
    profiles:
      - import
    depends_on:
      db:
        condition: service_healthy
      importer:
        condition: service_completed_successfully
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
    entrypoint:
      ["psql", "-v", "ON_ERROR_STOP=1", "-f", "/scripts/post_import.sql"]
    volumes:
      - ./scripts:/scripts:ro
    networks:
      - mapnet

  martin:
    image: ghcr-mirror.liara.ir/maplibre/martin:1.16.1
    # image: ghcr.io/maplibre/martin:1.16.1
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # Config file disables Martin's in-memory tile cache (cache: disable).
    # Without it, tiles are generated once and served stale forever, so the
    # traffic colors on the map would never change. The connection string
    # inside the config uses the same POSTGRES_* env vars.
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command:
      - "--config"
      - "/config/martin.yaml"
      - "--font"
      - "/fonts"
    volumes:
      - ./fonts:/fonts:ro
      - ./config/martin.yaml:/config/martin.yaml:ro
    mem_limit: 1g
    cpus: "1"
    networks:
      - mapnet

  # Spark + Sedona playground: 1 master + 1 worker + JupyterLab (no token).
  # Notebooks live in ./sedona/notebooks, mounted at the image's /opt/workspace.
  sedona:
    image: docker.arvancloud.ir/apache/sedona:1.9.1
    restart: unless-stopped
    environment:
      DRIVER_MEM: 2g
      EXECUTOR_MEM: 2g
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "8888:8888" # JupyterLab
      - "8086:8080" # Spark master UI (8080 is taken by web)
      - "8087:8081" # Spark worker UI
    volumes:
      - ./sedona/notebooks:/opt/workspace:rw
      - sedona_ivy:/root/.ivy2
    networks:
      - mapnet

  # Spark Structured Streaming job: reads GPS pings from Redpanda's `gps-raw`
  # topic, flags pings with a large GPS accuracy error (radius_error_m > 40 m)
  # as invalid, spatial-joins each ping to its nearest street (PostGIS `roads`
  # table) and adds `street_id`, then writes them back to Redpanda on
  # `gps-processed`.
  sedona-stream:
    image: docker.arvancloud.ir/apache/sedona:1.9.1
    restart: unless-stopped
    depends_on:
      - redpanda-0
      - db
    environment:
      DRIVER_MEM: 1g
      EXECUTOR_MEM: 1g
      # spark-submit needs a plain python, not jupyter (the image default).
      PYSPARK_DRIVER_PYTHON: python3
      PYSPARK_PYTHON: python3
      KAFKA_BOOTSTRAP: redpanda-0:29092
      RAW_TOPIC: gps-raw
      PROCESSED_TOPIC: gps-processed
      MAX_RADIUS_ERROR_M: "40"
      TRIGGER_INTERVAL: "15 seconds"
      FREE_FLOW_SPEED_KMH: "30"
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command:
      - /opt/spark/bin/spark-submit
      - --master
      - local[2]
      # Kafka connector for Spark 4.0 / Scala 2.13 + Postgres JDBC driver,
      # pre-fetched into ./sedona/jars (mounted below). Using --jars instead
      # of --packages avoids a runtime Ivy download from Maven Central, which
      # hangs indefinitely on some networks (TLS handshake black-hole).
      - --jars
      - /opt/workspace/jars/spark-sql-kafka-0-10_2.13-4.0.1.jar,/opt/workspace/jars/spark-token-provider-kafka-0-10_2.13-4.0.1.jar,/opt/workspace/jars/kafka-clients-3.9.1.jar,/opt/workspace/jars/commons-pool2-2.12.0.jar,/opt/workspace/jars/postgresql-42.7.7.jar
      - /opt/workspace/streaming_job.py
    volumes:
      - ./sedona/streaming_job.py:/opt/workspace/streaming_job.py:ro
      - ./sedona/jars:/opt/workspace/jars:ro
      - sedona_checkpoints:/opt/workspace/.checkpoints
    networks:
      - mapnet

  web:
    image: docker.arvancloud.ir/library/nginx:1.31.5-alpine3.24-perl
    restart: unless-stopped
    depends_on:
      - martin
    ports:
      - "8080:80"
    volumes:
      - ./web/index.html:/usr/share/nginx/html/index.html:ro
      - ./web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Vazirmatn TTF served at /fonts/ for the HTML UI (legend, popups);
      # the same directory feeds Martin's map-label glyphs.
      - ./fonts:/fonts:ro
    mem_limit: 1g
    cpus: "1"
    networks:
      - mapnet

  clickhouse:
    image: docker.arvancloud.ir/clickhouse/clickhouse-server:26.3
    container_name: clickhouse
    environment:
      # Without these the image restricts 'default' to container-localhost only,
      # so host connections fail with "Authentication failed" (code 194).
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    ports:
      - "8123:8123" # HTTP interface
      - "9000:9000" # native interface (clickhouse-client)
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      # caps memory/threads so CH stays inside its container limit
      # - ./clickhouse/config.d/limits.xml:/etc/clickhouse-server/config.d/limits.xml:ro
      # runs at startup: creates Kafka engine table + MV to consume from Redpanda
      - ./clickhouse/initdb/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query 'SELECT 1'"]
      interval: 5s
      timeout: 3s
      retries: 12
    mem_limit: 3g
    cpus: "1"
    networks:
      - mapnet

volumes:
  postgres_data:
  sedona_ivy:
  sedona_checkpoints:
  clickhouse-data:

networks:
  mapnet:
