name: geostream-maps

services:
  postgres-1:
    image: docker.arvancloud.ir/postgis/postgis:16-3.5
    container_name: postgres-1
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    ports:
      - "15432:5432"
    mem_limit: 512m
    cpus: "0.5"
    networks:
      - mapnet

  airflow-db-init:
    image: docker.arvancloud.ir/postgis/postgis:16-3.5
    depends_on:
      postgres-1:
        condition: service_healthy
    environment:
      PGHOST: postgres-1
      PGPORT: "5432"
      PGDATABASE: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if ! psql -tAc "SELECT 1 FROM pg_database WHERE datname = 'airflow'" | grep -q 1; then
          createdb -O "$$PGUSER" airflow
        fi
    mem_limit: 64m
    cpus: "0.1"
    networks:
      - mapnet

  airflow:
    build: ./airflow
    image: geostream-maps-airflow:3.3.1-python3.12
    restart: unless-stopped
    depends_on:
      airflow-db-init:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      polaris-init:
        condition: service_completed_successfully
      sedona-1:
        condition: service_started
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__PARALLELISM: "2"
      AIRFLOW__CORE__DAGBAG_IMPORT_TIMEOUT: "90"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-1:5432/airflow
      AIRFLOW_CONN_SPARK_SEDONA: '{"conn_type":"spark","host":"spark://sedona-1:7077"}'
      PREDICTION_PGHOST: postgres-1
      PREDICTION_PGPORT: "5432"
      PREDICTION_PGDATABASE: ${POSTGRES_DB}
      PREDICTION_PGUSER: ${POSTGRES_USER}
      PREDICTION_PGPASSWORD: ${POSTGRES_PASSWORD}
      POLARIS_URI: http://polaris-1:8181/api/catalog
      POLARIS_CREDENTIAL: ${POLARIS_ROOT_CLIENT_ID}:${POLARIS_ROOT_CLIENT_SECRET}
      POLARIS_CATALOG: polaris
      POLARIS_NAMESPACE: telemetry
      POLARIS_TABLE: gps_processed
      MINIO_ENDPOINT: http://minio-1:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_REGION: us-east-1
    command: ["standalone"]
    ports:
      - "8081:8080"
    volumes:
      - airflow-data:/opt/airflow
      - ./airflow/dags:/opt/airflow/dags:ro
      - ./sedona/street_speed_prediction.py:/opt/airflow/sedona/street_speed_prediction.py:ro
      - sedona-jars:/opt/spark-jars:ro
    mem_limit: 1536m
    cpus: "0.5"
    networks:
      - mapnet

  redpanda-1:
    container_name: redpanda-1
    image: docker.arvancloud.ir/redpandadata/redpanda:v26.2.2
    command:
      - redpanda
      - start
      - --smp 1
      - --memory 1G
      - --reserve-memory 0M
      - --kafka-addr internal://0.0.0.0:29092,external://0.0.0.0:9092
      - --advertise-kafka-addr internal://redpanda-1:29092,external://localhost:9092
    ports:
      - "9092:9092"
    mem_limit: 1.5g
    cpus: "1"
    networks:
      - mapnet

  redpanda-init:
    image: docker.arvancloud.ir/redpandadata/redpanda:v26.2.2
    depends_on:
      redpanda-1:
        condition: service_started
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        rpk -X brokers=redpanda-1:29092 cluster health --exit-when-healthy
        rpk -X brokers=redpanda-1:29092 topic create --if-not-exists --partitions 1 --replicas 1 gps-raw gps-processed
    mem_limit: 64m
    cpus: "0.1"
    networks:
      - mapnet

  redpanda-console:
    container_name: redpanda-console
    image: docker.arvancloud.ir/redpandadata/console:v3.11.0
    entrypoint: /bin/sh
    command: -c 'echo "$$CONSOLE_CONFIG_FILE" > /tmp/config.yml; /app/console'
    environment:
      CONFIG_FILEPATH: /tmp/config.yml
      CONSOLE_CONFIG_FILE: |
        kafka:
          brokers: ["redpanda-1:29092"]
        redpanda:
          adminApi:
            enabled: true
            urls: ["http://redpanda-1:9644"]
    ports:
      - "9300:8080"
    depends_on:
      - redpanda-1
    mem_limit: 128m
    cpus: "0.25"
    networks:
      - mapnet

  download-and-trim-map:
    image: docker.arvancloud.ir/stefda/osmium-tool:latest
    profiles:
      - import
    entrypoint: ["/bin/sh", "/postgres/download-and-trim-map.sh"]
    volumes:
      - ./postgres:/postgres
    environment:
      MAP_URL: https://download.geofabrik.de/asia/iran-latest.osm.pbf
      BBOX: 51.05,35.50,51.65,35.95
      FORCE_DOWNLOAD: "false"
      FORCE_TRIM: "false"
    mem_limit: 2g
    cpus: "2"
    networks:
      - mapnet

  import-map-to-postgres:
    image: docker.arvancloud.ir/iboates/osm2pgsql:2.3.1
    profiles:
      - import
    depends_on:
      postgres-1:
        condition: service_healthy
    environment:
      PGHOST: postgres-1
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
    entrypoint: ["/bin/sh", "/scripts/import-map-to-postgres-tables.sh"]
    volumes:
      - ./postgres/raw-map-data:/data:ro
      - ./postgres:/scripts:ro
    mem_limit: 1g
    cpus: "2"
    networks:
      - mapnet

  create-postgres-columns:
    image: docker.arvancloud.ir/postgis/postgis:16-3.5
    profiles:
      - import
    depends_on:
      postgres-1:
        condition: service_healthy
      import-map-to-postgres:
        condition: service_completed_successfully
    environment:
      PGHOST: postgres-1
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
    entrypoint:
      [
        "psql",
        "-v",
        "ON_ERROR_STOP=1",
        "-f",
        "/scripts/create-postgres-columns.sql",
      ]
    volumes:
      - ./postgres:/scripts:ro
    mem_limit: 128m
    cpus: "0.25"
    networks:
      - mapnet

  martin:
    image: ghcr-mirror.liara.ir/maplibre/martin:1.16.1
    restart: unless-stopped
    depends_on:
      postgres-1:
        condition: service_healthy
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command:
      - "--config"
      - "/config/martin.yaml"
      - "--font"
      - "/fonts"
    volumes:
      - ./web/fonts:/fonts:ro
      - ./web/martin.yaml:/config/martin.yaml:ro
    mem_limit: 64m
    cpus: "0.25"
    networks:
      - mapnet

  minio-init:
    image: docker.arvancloud.ir/minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      - minio-1
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    entrypoint:
      - /bin/sh
      - -c
      - |
        i=0; until mc alias set lakehouse-init http://minio-1:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null 2>&1; do
          i=$$((i+1));
          if [ "$$i" -ge 30 ]; then echo "minio-init: MinIO unreachable, giving up"; exit 1; fi
          echo "minio-init: waiting for MinIO..."; sleep 2;
        done
        mc mb --ignore-existing lakehouse-init/lakehouse
    mem_limit: 64m
    cpus: "0.1"
    networks:
      - mapnet

  sedona-1:
    build: ./sedona
    image: geostream-maps-sedona:1.9.1
    restart: unless-stopped
    depends_on:
      redpanda-1:
        condition: service_started
      redpanda-init:
        condition: service_completed_successfully
      postgres-1:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
      polaris-init:
        condition: service_completed_successfully
    environment:
      SPARK_MASTER_HOST: sedona-1
      SPARK_LOCAL_HOSTNAME: sedona-1
      DRIVER_MEM: 1g
      EXECUTOR_MEM: 1g
      PYSPARK_DRIVER_PYTHON: python3
      PYSPARK_PYTHON: python3
      KAFKA_BOOTSTRAP: redpanda-1:29092
      RAW_TOPIC: gps-raw
      PROCESSED_TOPIC: gps-processed
      MAX_RADIUS_ERROR_M: "40"
      TRIGGER_INTERVAL: "15 seconds"
      FREE_FLOW_SPEED_KMH: "30"
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      MINIO_ENDPOINT: minio-1:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_REGION: us-east-1
      LAKEHOUSE_BUCKET: lakehouse
      LAKEHOUSE_TRIGGER: "60 seconds"
      POLARIS_URI: http://polaris-1:8181/api/catalog
      POLARIS_CREDENTIAL: ${POLARIS_ROOT_CLIENT_ID}:${POLARIS_ROOT_CLIENT_SECRET}
    ports:
      - "15002:15002"
      - "4040:4040"
      - "4041:4041"
      - "4042:4042"
      - "7079:7079"
      - "7080:7080"
    volumes:
      - sedona-jars:/opt/workspace/jars
      - ./sedona/streaming_job.py:/opt/workspace/streaming_job.py:ro
      - ./sedona/lakehouse_job.py:/opt/workspace/lakehouse_job.py:ro
      - ./sedona/start-jobs.sh:/opt/workspace/start-jobs.sh:ro
      - sedona-checkpoints:/opt/workspace/.checkpoints
    mem_limit: 5g
    cpus: "2"
    networks:
      - mapnet

  web:
    image: docker.arvancloud.ir/library/nginx:1.31.5-alpine3.24-perl
    restart: unless-stopped
    depends_on:
      - martin
    ports:
      - "8080:80"
    volumes:
      - ./web/index.html:/usr/share/nginx/html/index.html:ro
      - ./web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./web/fonts:/fonts:ro
    mem_limit: 64m
    cpus: "0.1"
    networks:
      - mapnet

  clickhouse-1:
    image: docker.arvancloud.ir/clickhouse/clickhouse-server:26.3
    container_name: clickhouse-1
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    ports:
      - "8123:8123" # HTTP interface
      - "9000:9000" # native interface (clickhouse-client)
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./clickhouse/initdb/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query 'SELECT 1'"]
      interval: 5s
      timeout: 3s
      retries: 12
    mem_limit: 512m
    cpus: "0.5"
    networks:
      - mapnet

  superset:
    build: ./superset
    image: geostream-maps-superset:6.1.0
    restart: unless-stopped
    depends_on:
      clickhouse-1:
        condition: service_healthy
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
      SUPERSET_ADMIN_USERNAME: ${SUPERSET_ADMIN_USERNAME}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD}
      SUPERSET_ADMIN_FIRST_NAME: ${SUPERSET_ADMIN_FIRST_NAME}
      SUPERSET_ADMIN_LAST_NAME: ${SUPERSET_ADMIN_LAST_NAME}
      SUPERSET_ADMIN_EMAIL: ${SUPERSET_ADMIN_EMAIL}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      SQLALCHEMY_DATABASE_URI: sqlite:////app/superset/superset.db
    volumes:
      - ./superset/superset-init.sh:/superset-init.sh:ro
      - ./superset/superset_config.py:/app/pythonpath/superset_config.py:ro  
    command:
      - /bin/sh
      - /superset-init.sh
    ports:
      - "8088:8088"
    mem_limit: 1.5g
    cpus: "0.75"
    networks:
      - mapnet

  generator:
    build: ./generator
    image: geostream-maps-generator:1.0
    restart: unless-stopped
    depends_on:
      redpanda-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP: redpanda-1:29092
      TZ: Asia/Tehran
    mem_limit: 128m
    cpus: "0.25"
    networks:
      - mapnet

  minio-1:
    image: docker.arvancloud.ir/minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: minio-1
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
      - MINIO_DOMAIN=storage
      - MINIO_REGION_NAME=us-east-1
      - MINIO_REGION=us-east-1
    networks:
      mapnet:
    ports:
      - 19000:9000    # S3 API 
      - 19001:9001    # Web UI 
    volumes:
      - minio-data:/data
    command: ["server", "/data", "--console-address", ":9001"]
    mem_limit: 0.5g
    cpus: "0.25"

  polaris-1:
    image: docker.arvancloud.ir/apache/polaris:1.8.0
    container_name: polaris-1
    ports:
      - "8181:8181" # Polaris REST API
    environment:
      - JAVA_TOOL_OPTIONS=-Dpolaris.bootstrap.root=true   
      - POLARIS_BOOTSTRAP_CREDENTIALS=POLARIS,${POLARIS_ROOT_CLIENT_ID},${POLARIS_ROOT_CLIENT_SECRET}
      - polaris.realm-context.realms=POLARIS
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER}
      - AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD}
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8182/q/health"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      mapnet:
    mem_limit: 1g
    cpus: "0.5"

  polaris-init:
    image: docker.arvancloud.ir/curlimages/curl:8.12.1
    depends_on:
      polaris-1:
        condition: service_healthy
    environment:
      POLARIS_ROOT_CLIENT_ID: ${POLARIS_ROOT_CLIENT_ID}
      POLARIS_ROOT_CLIENT_SECRET: ${POLARIS_ROOT_CLIENT_SECRET}
    entrypoint: ["/bin/sh", "/scripts/polaris-init.sh"]
    volumes:
      - ./polaris:/scripts:ro
    mem_limit: 64m
    cpus: "0.1"
    networks:
      - mapnet

volumes:
  postgres-data:
  sedona-ivy:
  sedona-checkpoints:
  sedona-jars:
  clickhouse-data:
  minio-data: 
  airflow-data:

networks:
  mapnet:
