name: mahyaar-maps

services:
  postgres-1:
    image: docker.arvancloud.ir/postgis/postgis:16-3.5
    container_name: postgres-1
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "15432:5432"
    mem_limit: 512m
    cpus: "0.5"
    networks:
      - mapnet

  redpanda-1:
    container_name: redpanda-1
    image: docker.arvancloud.ir/redpandadata/redpanda:v26.2.2
    command:
      - redpanda
      - start
      - --smp 1
      - --memory 1G
      - --reserve-memory 0M
      - --kafka-addr internal://0.0.0.0:29092,external://0.0.0.0:9092
      - --advertise-kafka-addr internal://redpanda-1:29092,external://localhost:9092
    ports:
      - "9092:9092"
    mem_limit: 1.5g
    cpus: "1"
    networks:
      - mapnet

  redpanda-console:
    container_name: redpanda-console
    image: docker.arvancloud.ir/redpandadata/console:v3.11.0
    entrypoint: /bin/sh
    command: -c 'echo "$$CONSOLE_CONFIG_FILE" > /tmp/config.yml; /app/console'
    environment:
      CONFIG_FILEPATH: /tmp/config.yml
      CONSOLE_CONFIG_FILE: |
        kafka:
          brokers: ["redpanda-1:29092"]
        redpanda:
          adminApi:
            enabled: true
            urls: ["http://redpanda-1:9644"]
    ports:
      - "9300:8080"
    depends_on:
      - redpanda-1
    mem_limit: 128m
    cpus: "0.25"
    networks:
      - mapnet

  import-map-to-postgres:
    image: docker.arvancloud.ir/iboates/osm2pgsql:2.3.1
    profiles:
      - import
    depends_on:
      postgres-1:
        condition: service_healthy
    environment:
      PGHOST: postgres-1
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
    entrypoint: ["/bin/sh", "/scripts/import-map-to-postgres-tables.sh"]
    volumes:
      - ./data:/data:ro
      # - ./postgres/config:/config:ro
      - ./postgres:/scripts:ro
    mem_limit: 1g
    cpus: "2"
    networks:
      - mapnet

  create-postgres-columns:
    image: docker.arvancloud.ir/postgis/postgis:16-3.5
    profiles:
      - import
    depends_on:
      postgres-1:
        condition: service_healthy
      import-map-to-postgres:
        condition: service_completed_successfully
    environment:
      PGHOST: postgres-1
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
    entrypoint:
      [
        "psql",
        "-v",
        "ON_ERROR_STOP=1",
        "-f",
        "/scripts/create-postgres-columns.sql",
      ]
    volumes:
      - ./postgres:/scripts:ro
    mem_limit: 128m
    cpus: "0.25"
    networks:
      - mapnet

  martin:
    image: ghcr-mirror.liara.ir/maplibre/martin:1.16.1
    # image: ghcr.io/maplibre/martin:1.16.1
    restart: unless-stopped
    depends_on:
      postgres-1:
        condition: service_healthy
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command:
      - "--config"
      - "/config/martin.yaml"
      - "--font"
      - "/fonts"
    volumes:
      - ./web/fonts:/fonts:ro
      - ./web/martin.yaml:/config/martin.yaml:ro
    mem_limit: 64m
    cpus: "0.25"
    networks:
      - mapnet

  sedona-jupyter:
    image: docker.arvancloud.ir/apache/sedona:1.9.1
    restart: unless-stopped
    profiles:
      - sedona-jupyter
    environment:
      DRIVER_MEM: 2g
      EXECUTOR_MEM: 2g
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "8888:8888" # JupyterLab
      - "8086:8080" # Spark master UI (8080 is taken by web)
      - "8087:8081" # Spark worker UI
    volumes:
      - ./sedona/notebooks:/opt/workspace:rw
      - sedona-ivy:/root/.ivy2
    mem_limit: 3g
    cpus: "2"
    networks:
      - mapnet

  minio-init:
    image: docker.arvancloud.ir/minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      - minio-1
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    entrypoint:
      - /bin/sh
      - -c
      # retry until MinIO is accepting connections, then create the bucket
      - |
        i=0; until mc alias set lakehouse-init http://minio-1:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null 2>&1; do
          i=$$((i+1));
          if [ "$$i" -ge 30 ]; then echo "minio-init: MinIO unreachable, giving up"; exit 1; fi
          echo "minio-init: waiting for MinIO..."; sleep 2;
        done
        mc mb --ignore-existing lakehouse-init/lakehouse
    mem_limit: 64m
    cpus: "0.1"
    networks:
      - mapnet

  sedona-stream:
    build: ./sedona
    image: mahyaar-maps-sedona-stream
    restart: unless-stopped
    depends_on:
      redpanda-1:
        condition: service_started
      postgres-1:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
      polaris-init:
        condition: service_completed_successfully
    environment:
      DRIVER_MEM: 1g
      EXECUTOR_MEM: 1g
      PYSPARK_DRIVER_PYTHON: python3
      PYSPARK_PYTHON: python3
      KAFKA_BOOTSTRAP: redpanda-1:29092
      RAW_TOPIC: gps-raw
      PROCESSED_TOPIC: gps-processed
      MAX_RADIUS_ERROR_M: "40"
      TRIGGER_INTERVAL: "15 seconds"
      FREE_FLOW_SPEED_KMH: "30"
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      MINIO_ENDPOINT: minio-1:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_REGION: us-east-1
      LAKEHOUSE_BUCKET: lakehouse
      LAKEHOUSE_TRIGGER: "60 seconds"
      POLARIS_URI: http://polaris-1:8181/api/catalog
      POLARIS_CREDENTIAL: ${POLARIS_ROOT_CLIENT_ID}:${POLARIS_ROOT_CLIENT_SECRET}
    volumes:
      - ./sedona/streaming_job.py:/opt/workspace/streaming_job.py:ro
      - ./sedona/lakehouse_job.py:/opt/workspace/lakehouse_job.py:ro
      - ./sedona/start-jobs.sh:/opt/workspace/start-jobs.sh:ro
      - sedona-checkpoints:/opt/workspace/.checkpoints
    mem_limit: 4g
    cpus: "2"
    networks:
      - mapnet

  web:
    image: docker.arvancloud.ir/library/nginx:1.31.5-alpine3.24-perl
    restart: unless-stopped
    depends_on:
      - martin
    ports:
      - "8080:80"
    volumes:
      - ./web/index.html:/usr/share/nginx/html/index.html:ro
      - ./web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Vazirmatn TTF served at /fonts/ for the HTML UI (legend, popups);
      # the same directory feeds Martin's map-label glyphs.
      - ./web/fonts:/fonts:ro
    mem_limit: 64m
    cpus: "0.1"
    networks:
      - mapnet

  clickhouse-1:
    image: docker.arvancloud.ir/clickhouse/clickhouse-server:26.3
    container_name: clickhouse-1
    environment:
      # Without these the image restricts 'default' to container-localhost only,
      # so host connections fail with "Authentication failed" (code 194).
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    ports:
      - "8123:8123" # HTTP interface
      - "9000:9000" # native interface (clickhouse-client)
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      # caps memory/threads so CH stays inside its container limit
      # - ./clickhouse/config.d/limits.xml:/etc/clickhouse-server/config.d/limits.xml:ro
      # runs at startup: creates Kafka engine table + MV to consume from Redpanda
      - ./clickhouse/initdb/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query 'SELECT 1'"]
      interval: 5s
      timeout: 3s
      retries: 12
    mem_limit: 512m
    cpus: "0.5"
    networks:
      - mapnet

  generator:
    build: ./generator
    image: mahyaar-maps-generator
    restart: unless-stopped
    depends_on:
      - redpanda-1
    environment:
      KAFKA_BOOTSTRAP: redpanda-1:29092
      TZ: Asia/Tehran
    mem_limit: 128m
    cpus: "0.25"
    networks:
      - mapnet

  minio-1:
    image: docker.arvancloud.ir/minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: minio-1
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
      - MINIO_DOMAIN=storage
      - MINIO_REGION_NAME=us-east-1
      - MINIO_REGION=us-east-1
    networks:
      mapnet:
    ports:
      - 19000:9000    # S3 API 
      - 19001:9001    # Web UI 
    volumes:
      - minio-data:/data
    command: ["server", "/data", "--console-address", ":9001"]
    mem_limit: 0.5g
    cpus: "0.25"

  polaris-1:
    image: docker.arvancloud.ir/apache/polaris:1.8.0
    # image: ghcr.io/apache/polaris:1.8.0
    container_name: polaris-1
    ports:
      - "8181:8181" # Polaris REST API
    environment:
      - JAVA_TOOL_OPTIONS=-Dpolaris.bootstrap.root=true   # Optional: Helps make startup logs clearer
      # Pin the root principal credentials — without this, Polaris generates a
      # RANDOM pair at every bootstrap (in-memory persistence) and prints it to
      # stdout. Format: <realm>,<clientId>,<clientSecret>
      - POLARIS_BOOTSTRAP_CREDENTIALS=POLARIS,${POLARIS_ROOT_CLIENT_ID},${POLARIS_ROOT_CLIENT_SECRET}
      - polaris.realm-context.realms=POLARIS
      # Polaris itself needs MinIO creds to validate/purge table locations
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER}
      - AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD}
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8182/q/health"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      mapnet:
    mem_limit: 1g
    cpus: "0.5"

  polaris-init:
    image: docker.arvancloud.ir/curlimages/curl:8.12.1
    depends_on:
      polaris-1:
        condition: service_healthy
    environment:
      POLARIS_ROOT_CLIENT_ID: ${POLARIS_ROOT_CLIENT_ID}
      POLARIS_ROOT_CLIENT_SECRET: ${POLARIS_ROOT_CLIENT_SECRET}
    entrypoint: ["/bin/sh", "/scripts/polaris-init.sh"]
    volumes:
      - ./polaris:/scripts:ro
    mem_limit: 64m
    cpus: "0.1"
    networks:
      - mapnet

volumes:
  postgres-data:
  sedona-ivy:
  sedona-checkpoints:
  clickhouse-data:
  minio-data: 

networks:
  mapnet:
