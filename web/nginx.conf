server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vazirmatn TTF for the HTML UI (legend, popups). Same ./fonts directory
    # that is mounted into the Martin container for map label glyphs.
    location /fonts/ {
        alias /fonts/;
        add_header Cache-Control "public, max-age=604800";
    }

    location /tiles/ {
        proxy_pass http://martin:3000/;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Useful while traffic values change frequently.
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ClickHouse HTTP interface for the street-history popup. The trailing
    # slash on proxy_pass strips the /clickhouse/ prefix, so the browser stays
    # same-origin (no CORS), same pattern as /tiles/ above. The server was
    # started with CLICKHOUSE_USER/CLICKHOUSE_PASSWORD from .env, so anonymous
    # queries are rejected — the credentials below must match .env.
    location /clickhouse/ {
        proxy_pass http://clickhouse:8123/;
        proxy_set_header Host $host;
        proxy_set_header X-ClickHouse-User "default";
        proxy_set_header X-ClickHouse-Key "changeme";
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}