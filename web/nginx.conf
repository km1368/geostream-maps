server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vazirmatn TTF for the HTML UI (legend, popups). Same ./fonts directory
    # that is mounted into the Martin container for map label glyphs.
    location /fonts/ {
        alias /fonts/;
        add_header Cache-Control "public, max-age=604800";
    }

    location /tiles/ {
        proxy_pass http://martin:3000/;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Useful while traffic values change frequently.
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location /clickhouse-1/ {
        proxy_pass http://clickhouse-1:8123/;
        proxy_set_header Host $host;
        proxy_set_header X-ClickHouse-User "default";
        proxy_set_header X-ClickHouse-Key "changeme";
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}