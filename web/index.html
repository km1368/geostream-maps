<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Tehran Traffic Map</title>

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <link
        rel="stylesheet"
        href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css"
    >

    <script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script>

    <style>
        html, body, #map {
            margin: 0;
            width: 100%;
            height: 100%;
        }

        .legend {
            position: absolute;
            z-index: 10;
            left: 12px;
            bottom: 30px;
            padding: 10px 12px;
            border-radius: 5px;
            background: rgba(255, 255, 255, 0.92);
            font: 13px sans-serif;
            line-height: 21px;
        }

        .swatch {
            display: inline-block;
            width: 22px;
            height: 5px;
            margin-right: 7px;
            vertical-align: middle;
        }
    </style>
</head>

<body>
<div id="map"></div>

<div class="legend">
    <div><span class="swatch" style="background:#24a148"></span>Free</div>
    <div><span class="swatch" style="background:#f1c21b"></span>Moderate</div>
    <div><span class="swatch" style="background:#ff832b"></span>Heavy</div>
    <div><span class="swatch" style="background:#da1e28"></span>Severe</div>
    <div><span class="swatch" style="background:#8d8d8d"></span>No data</div>
</div>

<script>
// Required for correct Persian/Arabic rendering: without this plugin,
// RTL text is drawn disconnected and left-to-right. It must be set
// before the map is created. The plugin is served from the same origin
// (nginx proxies /tiles/ to Martin, which has no plugin endpoint, so we
// use the official CDN copy).
maplibregl.setRTLTextPlugin(
    "https://unpkg.com/@mapbox/mapbox-gl-rtl-text@0.3.0/dist/mapbox-gl-rtl-text.js",
    (error) => {
        if (error) {
            console.error("Failed to load RTL text plugin:", error);
        }
    },
    true // lazy: only load the plugin when RTL text is actually needed
);

const map = new maplibregl.Map({
    container: "map",
    center: [51.3890, 35.6892],
    zoom: 8,
    minZoom: 8,
    maxZoom: 15,
    maxBounds: [
        [51.05, 35.50], // Southwest corner (lng, lat)
        [51.70, 35.90]  // Northeast corner (lng, lat)
    ],

    style: {
        version: 8,

        // MapLibre needs glyph PBFs to draw any text. Martin generates them
        // on the fly from the font files mounted into the martin container
        // (see docker-compose.yml). The fontstack name must match the font
        // name inside the file — check http://localhost:8080/tiles/catalog
        // under "fonts" for the exact name to use here.
        glyphs: `${location.origin}/tiles/font/{fontstack}/{range}`,

        sources: {
            green: {
                type: "vector",
                tiles: [
                    `${location.origin}/tiles/green_areas/{z}/{x}/{y}`
                ],
                minzoom: 8,
                maxzoom: 20
            },
            water: {
                type: "vector",
                tiles: [
                    `${location.origin}/tiles/water_areas/{z}/{x}/{y}`
                ],
                minzoom: 8,
                maxzoom: 20
            },
            roads: {
                type: "vector",
                tiles: [
                    `${location.origin}/tiles/roads/{z}/{x}/{y}`
                ],
                minzoom: 8,
                maxzoom: 20
            }
        },

        layers: [
            {
                id: "background",
                type: "background",
                paint: {
                    "background-color": "#f2efe9"
                }
            },

            {
                id: "green-fill",
                type: "fill",
                source: "green",
                "source-layer": "green_areas",
                paint: {
                    "fill-color": "#cfe3c0",
                    "fill-opacity": 0.85
                }
            },

            {
                id: "water-fill",
                type: "fill",
                source: "water",
                "source-layer": "water_areas",
                paint: {
                    "fill-color": "#a5c8e3",
                    "fill-opacity": 0.9
                }
            },

            {
                // Minor streets. Drawn so their labels don't float on the
                // empty background; kept thin so major roads dominate.
                id: "road-minor",
                type: "line",
                source: "roads",
                "source-layer": "roads",
                minzoom: 11,
                filter: [
                    "match",
                    ["get", "highway"],
                    [
                        "tertiary", "tertiary_link",
                        "residential", "unclassified", "living_street"
                    ],
                    true,
                    false
                ],
                paint: {
                    "line-color": "#ffffff",
                    "line-opacity": 0.9,
                    "line-width": [
                        "interpolate",
                        ["linear"],
                        ["zoom"],
                        11, 0.8,
                        13, 1.8,
                        16, 5
                    ]
                }
            },

            {
                id: "road-casing",
                type: "line",
                source: "roads",
                "source-layer": "roads",
                filter: [
                    "match",
                    ["get", "highway"],
                    [
                        "motorway", "motorway_link",
                        "trunk", "trunk_link",
                        "primary", "primary_link",
                        "secondary", "secondary_link"
                    ],
                    true,
                    false
                ],
                paint: {
                    "line-color": "#ffffff",
                    "line-opacity": 0.9,
                    "line-width": [
                        "interpolate",
                        ["linear"],
                        ["zoom"],
                        9, 1.5,
                        12, 3.5,
                        16, 9
                    ]
                }
            },

            {
                id: "traffic",
                type: "line",
                source: "roads",
                "source-layer": "roads",
                filter: [
                    "match",
                    ["get", "highway"],
                    [
                        "motorway", "motorway_link",
                        "trunk", "trunk_link",
                        "primary", "primary_link",
                        "secondary", "secondary_link"
                    ],
                    true,
                    false
                ],
                paint: {
                    "line-color": [
                        "match",
                        ["coalesce", ["get", "traffic_level"], -1],
                        0, "#24a148",
                        1, "#f1c21b",
                        2, "#ff832b",
                        3, "#da1e28",
                        "#8d8d8d"
                    ],

                    "line-width": [
                        "interpolate",
                        ["linear"],
                        ["zoom"],
                        9, 0.7,
                        12, 2,
                        16, 6
                    ],

                    "line-opacity": 0.95
                }
            },

            {
                id: "street-labels",
                type: "symbol",
                source: "roads",
                "source-layer": "roads",
                filter: [
                    "match",
                    ["get", "highway"],
                    [
                        "motorway", "motorway_link",
                        "trunk", "trunk_link",
                        "primary", "primary_link",
                        "secondary", "secondary_link",
                        "tertiary", "tertiary_link"
                    ],
                    true,
                    false
                ],
                layout: {
                    // Prefer the explicit Persian name, then the default OSM
                    // name (which is Persian in Iran data). name_en is
                    // deliberately NOT a fallback: most Iranian ways have no
                    // name:fa tag, only name + name:en, so falling back to
                    // name_en would show English labels all over the map.
                    "text-field": [
                        "coalesce",
                        ["get", "name_fa"],
                        ["get", "name"]
                    ],
                    // Must match a fontstack served by Martin. Check
                    // http://localhost:8080/tiles/catalog for exact names.
                    "text-font": ["IRANSansXFaNum Regular"],
                    "text-size": [
                        "interpolate", ["linear"], ["zoom"],
                        10, 9,
                        13, 12,
                        16, 14
                    ],
                    "symbol-placement": "line",
                    // Repeat the label along long streets more often than
                    // the 250px default.
                    "symbol-spacing": 180,
                    "text-rotation-alignment": "map",
                    "text-pitch-alignment": "viewport",
                    // 30 rejected many placements on curved streets; the
                    // default 45 lets far more labels through.
                    "text-max-angle": 45,
                    "text-letter-spacing": 0.05,
                    "text-padding": 2
                },
                paint: {
                    "text-color": "#333333",
                    "text-halo-color": "#ffffff",
                    "text-halo-width": 1.5
                }
            },

            {
                // Labels for minor streets, only from z13 up — at the
                // startup zoom there would be far too many of them.
                id: "street-labels-minor",
                type: "symbol",
                source: "roads",
                "source-layer": "roads",
                minzoom: 13,
                filter: [
                    "match",
                    ["get", "highway"],
                    ["residential", "unclassified", "living_street"],
                    true,
                    false
                ],
                layout: {
                    "text-field": [
                        "coalesce",
                        ["get", "name_fa"],
                        ["get", "name"]
                    ],
                    "text-font": ["IRANSansXFaNum Regular"],
                    "text-size": [
                        "interpolate", ["linear"], ["zoom"],
                        13, 10,
                        16, 12
                    ],
                    "symbol-placement": "line",
                    "text-rotation-alignment": "map",
                    "text-pitch-alignment": "viewport",
                    "text-max-angle": 45,
                    "text-letter-spacing": 0.05,
                    "text-padding": 2
                },
                paint: {
                    "text-color": "#6b6b6b",
                    "text-halo-color": "#ffffff",
                    "text-halo-width": 1.2
                }
            }
        ]
    }
});

map.addControl(new maplibregl.NavigationControl(), "top-right");

map.on("click", "traffic", (event) => {
    const feature = event.features[0];
    const p = feature.properties;

    new maplibregl.Popup()
        .setLngLat(event.lngLat)
        .setHTML(`
            <strong>${p.name_fa || p.name || "Unnamed road"}</strong><br>
            OSM way: ${p.osm_id}<br>
            Class: ${p.highway || "unknown"}<br>
            Speed: ${p.speed_kmh ?? "No data"} km/h<br>
            Traffic level: ${p.traffic_level ?? "No data"}
        `)
        .addTo(map);
});

map.on("mouseenter", "traffic", () => {
    map.getCanvas().style.cursor = "pointer";
});

map.on("mouseleave", "traffic", () => {
    map.getCanvas().style.cursor = "";
});
</script>
</body>
</html>
